name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          # GitHub's default token does not trigger other workflows for the generated PR.
          # Use a GitHub App or PAT token here if release-PR checks should run automatically.
          token: ${{ secrets.GITHUB_TOKEN }}
